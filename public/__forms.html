<!doctype html>
<!-- Netlify Forms detects this static form at deploy. Fields must match components/sections/Contact.tsx. -->
<html>
  <body>
    <form name="project" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <select name="need"><option>Web app or website</option></select>
      <select name="budget"><option>Not sure yet</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
